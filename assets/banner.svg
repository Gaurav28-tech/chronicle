  </g>

  <!-- Big Title -->
  <text x="60" y="155" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="-1">CHRONICLE</text>

  <!-- Tagline -->
  <text x="60" y="210" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="400">Cryptographically verifiable tamper-evident audit ledger with SHA-256 hash chaining.</text>

